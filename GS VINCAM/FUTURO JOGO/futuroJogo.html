<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Jogo</title>
  <link rel="stylesheet" href="painelJogo.css">
  <link rel="stylesheet" href="escondidoItem.css">
</head>


<body>
  
  <div class="aproveite">
    
  
    <h1 id="info"> APROVEITE E GASTE O QUANTO QUISER! </h1>
  
</div>
  
  <section class="painel">
    
    <div class="loja">
      
      <div class="comprar">
        <h2> Compre seu produto Sortido! </h2>
        
        <button type="submit" id="comprar">
          
          COMPRAR
          
        </button>
      </div>
      
      <div class="excluir">
        <h2> Excluir Produto </h2>
        
        <button type="submit" id="escolher">
          
          ESCOLHA 
          
        </button>
      </div>
      
      <div class="ganhar">
        <h2> Garanta Fundos </h2>
        
        <button type="submit" id="receber">
          RECEBER
        </button>
      </div>
      
    </div>
    
    <div class="caixaValor">
    
      <div class="compras">
        <h2> VER PRODUTO</h2>
        
        <button type="submit">
          VER
        </button>
      </div>
      
      <div class="pontuacao">
        
        <h3 id="pontos"> 0 </h3>
        <p>PONTOS</p>
        
      </div>
    
    </div>
  
  </section>

    <div class="aparecerItens">

        <div class="itemSapato">

            <img src="./IMAGE/sapato de fogo.webp" alt="sapatoDeFogo" id="imgSapatos">

            <div class="btns">
                <div>
                    <button id="adquirir">
                        Adquirir
                    </button>
                </div>

                <div>
                    <button id="outroItem">
                        Outro Item
                    </button>
                </div>
            </div>
        </div>

    </div>
  
  
  <script src="futuroJogo.js"></script>
    
</body>

</html>
