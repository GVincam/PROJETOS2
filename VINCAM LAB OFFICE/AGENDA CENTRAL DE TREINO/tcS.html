<!DOCTYPE html>
<html lang="pt-br">

    <title> Agenda Central de Treino </title>

<body>
    
    <div class="navbar">

            <ul>

                <li id="minhasMetas"> Minhas Metas </li>

        </nav>
    </div>

    <div class="nivel">

        <div class="nivelFoto">

            <img src="/IMAGE/jujutsu.jpg" alt="" style="width: 80px; border-radius: 50%; display:block;">

        <div class="caixaMetas">
