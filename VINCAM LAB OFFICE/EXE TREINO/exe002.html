<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> EXERCÍCIOS DOIS </title>
</head>
<body>

    <button onclick="mudarCor()"> 
        Mude a Cor! 
    </button>

    <div class="cor0">

    </div>

    <div class="cor1">

    </div>

    <div class="cor2">

    </div>

    <div class="cor3">

    </div>

    <div class="cor4">

    </div>

    <div class="cor5">

    </div>
    


    <script>

        // let cores = document.querySelectorAll(".cor");
        // let cores = document.getElementsByClassName("cor");
        let cores = [];
        cores.push(document.querySelector(".cor0"));
        cores.push(document.querySelector(".cor1"));
        cores.push(document.querySelector(".cor2"));
        cores.push(document.querySelector(".cor3"));
        cores.push(document.querySelector(".cor4"));
        cores.push(document.querySelector(".cor5"));


        function mudarCor(){

        for (let i = 0; i < cores.length; i++) {
            cores[i].style.width = "100px";
            cores[i].style.height = "100px";
            cores[i].style.background = "blue";
            alert("Cor " + (i+1) + " mudada!");
           
        }

    }

    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
