 #resultado{

 }

<body>

    <h1 id="name"> Mude meu nome!  </h1>

        Me Conheça

        e minha idade é!

    <script>
        function nome(gsSilva){

            let name1 = document.getElementById("name");

            name1.innerText = gsSilva;


        }

        function conhecer(){

        document.getElementById("descricao").innerText = "Olá Mundo e Olá a todos, meu nome é Gs Silva, sou dono da Vincam Lab!";


        }

        function somar(){
            return 10 + 11;
        }

        function mostrarIdade(){

            let resultado = somar();

            document.getElementById("resultado").innerText = resultado

        }

        
        


    </script>
